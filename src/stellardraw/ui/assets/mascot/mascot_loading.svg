<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600" role="img" aria-label="看板娘占位图 - 抽取中状态">
  <title>看板娘占位图 - 抽取中 (loading)</title>
  <desc>StellarDraw 占位素材。替换本文件即可更换看板娘形象，请保持文件名与画布比例 2:3 不变。</desc>

  <defs>
    <linearGradient id="loadBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4FC3F7"/>
      <stop offset="100%" stop-color="#5B7CFA"/>
    </linearGradient>
    <linearGradient id="loadHair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4FC3F7"/>
      <stop offset="100%" stop-color="#8B7CFF"/>
    </linearGradient>
  </defs>

  <!-- 脚下光晕（更亮，暗示能量聚集） -->
  <ellipse cx="200" cy="556" rx="130" ry="18" fill="#4FC3F7" opacity="0.22"/>

  <!-- 身体（略前倾以表现期待） -->
  <path d="M200 262 C246 262 272 300 276 380 L284 520 Q284 536 268 536 L132 536 Q116 536 116 520 L124 380 C128 300 154 262 200 262 Z"
        fill="url(#loadBody)" opacity="0.92"/>
  <!-- 胸前聚集的光点 -->
  <circle cx="200" cy="350" r="14" fill="#FFFFFF" opacity="0.55"/>
  <circle cx="200" cy="350" r="24" fill="#4FC3F7" opacity="0.25"/>

  <!-- 头部 -->
  <circle cx="200" cy="185" r="72" fill="#FFE3EC"/>

  <!-- 头发 -->
  <path d="M128 182 A72 72 0 0 1 272 182 L272 148 A72 58 0 0 0 128 148 Z" fill="url(#loadHair)"/>
  <path d="M130 176 q-16 92 8 152 q-32 -62 -24 -152 Z" fill="url(#loadHair)"/>
  <path d="M270 176 q16 92 -8 152 q32 -62 24 -152 Z" fill="url(#loadHair)"/>

  <!-- 眼睛（抽取中：专注的横线眼） -->
  <path d="M166 190 h20" stroke="#3B3A5A" stroke-width="6" stroke-linecap="round"/>
  <path d="M214 190 h20" stroke="#3B3A5A" stroke-width="6" stroke-linecap="round"/>

  <!-- 嘴（认真地抿着） -->
  <path d="M194 214 h12" stroke="#3B3A5A" stroke-width="3" stroke-linecap="round"/>

  <!-- 头顶的加载指示 -->
  <g transform="translate(200, 74)">
    <circle r="26" fill="none" stroke="#4FC3F7" stroke-width="5" opacity="0.25"/>
    <path d="M0 -26 A26 26 0 0 1 26 0" fill="none" stroke="#4FC3F7" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- 占位标识 -->
  <text x="200" y="580" text-anchor="middle" font-family="sans-serif" font-size="19"
        fill="#4FC3F7" opacity="0.7" letter-spacing="2">PLACEHOLDER - LOADING</text>
</svg>
