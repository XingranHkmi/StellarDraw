 <defs>
  <!-- 卡面中央的放射底纹 -->
  <linearGradient y2="1" x2="1" y1="0" x1="0" id="cardBg">
   <stop stop-color="#5B6BE8" offset="0%"/>
   <stop stop-color="#7C6BFF" offset="55%"/>
   <stop stop-color="#4FC3F7" offset="100%"/>
  </linearGradient>
  <linearGradient y2="1" x2="1" y1="0" x1="0" id="cardEdge">
   <stop stop-color="#FFE9A8" offset="0%"/>
   <stop stop-color="#FFC46B" offset="50%"/>
