  <title>Layer 1</title>
  <rect id="svg_1" fill="url(#iconBg)" rx="52" height="240" width="240" y="8" x="8"/>
  <g transform="rotate(-16 128.417 132)" id="svg_2">
   <rect id="svg_3" opacity="0.45" fill="#FFFFFF" rx="13" height="134" width="96" y="60" x="66.41667"/>
  </g>
  <g id="svg_4">
