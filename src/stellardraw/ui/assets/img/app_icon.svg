<svg width="256" height="256" xmlns="http://www.w3.org/2000/svg" aria-label="StellarDraw 应用图标" role="img">
 <title>AppIcon</title>
 <desc>占位图标。可用于打包时的 --icon 参数（需先转换为 .ico），或作为界面内的品牌标识。</desc>
 <defs>
  <linearGradient y2="1" x2="1" y1="0" x1="0" id="iconBg">
   <stop stop-color="#7C6BFF" offset="0%"/>
   <stop stop-color="#4FC3F7" offset="100%"/>
  </linearGradient>
  <linearGradient y2="1" x2="0" y1="0" x1="0" id="iconCard">
   <stop stop-color="#FFFFFF" offset="0%"/>
   <stop stop-color="#E8E4FF" offset="100%"/>
  </linearGradient>
 </defs>
 <!-- 圆角底板 -->
 <!-- 后方卡牌（倾斜） -->
 <!-- 前方卡牌（正面） -->
